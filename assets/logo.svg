<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2744" />
      <stop offset="100%" stop-color="#243b6b" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2cb5b0" />
      <stop offset="100%" stop-color="#1ea09b" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2cb5b0" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" filter="url(#glow)" />
  <rect x="6" y="6" width="500" height="500" rx="116" fill="none" stroke="#2cb5b0" stroke-width="4" stroke-opacity="0.4" />

  <!-- Graduation Cap -->
  <polygon points="180,120 256,88 332,120 256,152" fill="#f59e0b" />
  <polyline points="332,120 342,160 340,165" stroke="#f59e0b" stroke-width="4" fill="none" />
  <circle cx="340" cy="165" r="5" fill="#f59e0b" />

  <!-- Book Pages -->
  <!-- Left Page (Teal) -->
  <polygon points="110,360 246,340 246,170 110,190" fill="url(#tealGrad)" rx="8" />
  <!-- Letter U emblem on left page -->
  <path d="M 155,230 L 155,270 A 25,25 0 0,0 205,270 L 205,230" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />

  <!-- Right Page (White) -->
  <polygon points="266,340 402,360 402,190 266,170" fill="#ffffff" />
  <!-- Notebook Lines -->
  <line x1="290" y1="220" x2="378" y2="232" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
  <line x1="290" y1="255" x2="378" y2="267" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
  <line x1="290" y1="290" x2="378" y2="302" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
  <line x1="290" y1="325" x2="378" y2="337" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />

  <!-- Spine / Bookmark Ribbon -->
  <line x1="256" y1="165" x2="256" y2="365" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />

  <!-- Star / Accent Sparkle -->
  <circle cx="256" cy="415" r="7" fill="#2cb5b0" />
</svg>
